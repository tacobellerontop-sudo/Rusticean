name: Release

# Pushing a tag like v0.2.0 builds Rusticean and its installer and publishes them
# as a GitHub release for that tag. Running it by hand on a branch does the same for
# v<Cargo.toml version>, creating the tag on that commit.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Work out the tag
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $tag = "v$version"
          if ("${{ github.ref_type }}" -eq "tag" -and $tag -ne "${{ github.ref_name }}") {
            Write-Error "tag ${{ github.ref_name }} does not match Cargo.toml version $version"
            exit 1
          }
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: cargo test
      - run: cargo build --release
      - name: Build installer
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=$version" installer\Rusticean.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:TAG" `
            target/installer/Rusticean-Setup.exe `
            target/release/Rusticean.exe `
            --target "${{ github.sha }}" `
            --title "Rusticean $env:TAG" `
            --generate-notes
