[package]
name = "rbx-deploy"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
futures-util = "0.3.34"
hex = "0.4.3"
md-5 = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt", "time", "fs", "io-util", "macros", "sync"] }
tracing = "0.1.44"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "stream", "json", "http2", "system-proxy"] }

[target."cfg(not(windows))".dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json", "http2", "system-proxy"] }
